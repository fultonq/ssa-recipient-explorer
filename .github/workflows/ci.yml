name: ci
on: [push, pull_request]

jobs:
  cpp:
    runs-on: ubuntu-24.04
    strategy:
      matrix: { preset: [release, asan] }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - run: cmake --preset ${{ matrix.preset }} && cmake --build --preset ${{ matrix.preset }} -j
      - run: ctest --preset ${{ matrix.preset }}

  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build

  integration:
    # Seeds PostgreSQL, starts ssa_server, and proves both backends give identical answers.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: ssa, POSTGRES_USER: ssa, POSTGRES_PASSWORD: ssa }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ssa" --health-interval 5s --health-retries 20
    env: { PGHOST: localhost, PGUSER: ssa, PGPASSWORD: ssa, PGDATABASE: ssa }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev postgresql-client
      - run: cmake --preset release && cmake --build --preset release -j
      - run: SSA_RECORDS=200000 SSA_EXPORT=build/release/engine/ssa_export db/seed.sh
      - run: |
          build/release/server/ssa_server --port=8080 &
          timeout 120 bash -c 'until curl -sf localhost:8080/api/health; do sleep 1; done'
          python3 tools/compare_backends.py --queries 150

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ssa-recipient-explorer .
